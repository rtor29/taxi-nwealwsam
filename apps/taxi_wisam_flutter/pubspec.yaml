name: taxi_wisam_flutter
description: "Taxi-Wisam Passenger & Driver Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Real-time
  dio: ^5.4.0
  signalr_netcore: ^1.4.1
  web_socket_channel: ^3.0.3

  # State Management & DI
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  get_it: ^7.6.4

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Location & Mapping
  geolocator: ^10.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI, Icons, Fonts
  google_fonts: ^6.1.0
  intl: ^0.20.3
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
