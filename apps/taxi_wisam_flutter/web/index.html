<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="توصيله - منصة حجز وتتبع الرحلات والخطوط اليومية في محافظة النجف الأشرف">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    // Unconditionally purge old service workers and caches from previous versions
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="توصيله">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>توصيله | منصة حجز وتتبع الرحلات والخطوط اليومية</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #FFFFFF;
      transition: opacity 0.4s ease;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: #F59E0B;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #F8FAFC;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <span class="logo-text">🚖</span>
    </div>
    <div class="app-title">توصيله</div>
    <div class="app-subtitle">جاري تحميل المنصة الذكية...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // 0. Ensure consistent domain (nip.io is required for Google OAuth origins & redirect URIs)
    if (window.location.hostname === '173.212.206.86') {
      window.location.hostname = '173.212.206.86.nip.io';
    }

    // 1. Instantly capture OAuth login token from URL before Flutter starts
    (function() {
      try {
        var urlParams = new URLSearchParams(window.location.search);
        var token = urlParams.get('login_token');
        if (token) {
          var userId = urlParams.get('userId') || 'usr-google';
          var role = urlParams.get('role') || 'Customer';
          var fullName = decodeURIComponent(urlParams.get('fullName') || 'مستخدم Google');

          // Write standard keys
          localStorage.setItem('auth_token', token);
          localStorage.setItem('user_id', userId);
          localStorage.setItem('user_role', role);
          localStorage.setItem('user_fullname', fullName);

          // Write Flutter SharedPreferences keys
          localStorage.setItem('flutter.auth_token', token);
          localStorage.setItem('flutter.user_id', userId);
          localStorage.setItem('flutter.user_role', role);
          localStorage.setItem('flutter.user_fullname', fullName);

          // Clean URL parameters cleanly
          if (window.history && window.history.replaceState) {
            var cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
          }
        }
      } catch (err) {
        console.error('[TaxiWisam] Early auth sync error:', err);
      }
    })();

    // 2. Loading UI hide listener
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 400);
      }
    });

    // 3. Google OAuth Helper
    window.googleOAuthClientId = "483987924711-2935qs8ilglnen6jispd1u1t2fd0m2e6.apps.googleusercontent.com";
    window.startGoogleLogin = function() {
      var callbackUri = 'http://173.212.206.86.nip.io/api/auth/google/callback';
      var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth'
        + '?client_id=' + encodeURIComponent(window.googleOAuthClientId)
        + '&redirect_uri=' + encodeURIComponent(callbackUri)
        + '&response_type=code'
        + '&scope=openid%20email%20profile'
        + '&access_type=offline'
        + '&prompt=select_account';
      window.location.href = authUrl;
    };
  </script>
  <!-- Google Identity Services (GIS) SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    var bootScript = document.createElement('script');
    bootScript.src = 'flutter_bootstrap.js?v=' + Date.now();
    bootScript.async = true;
    document.body.appendChild(bootScript);
  </script>
</body>
</html>
