# Public Client App Domain: tawseelaiq.app (Serves Flutter Web App exclusively)
server {
    listen 80;
    listen [::]:80;
    server_name tawseelaiq.app www.tawseelaiq.app;

    root /var/www/taxi-wisam/build/web;
    index index.html;

    # Strictly block access to Admin Dashboard from public app domain
    location /dashboard {
        return 404;
    }

    # API endpoints proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OTP Web Screen proxy
    location /otp {
        proxy_pass http://127.0.0.1:5050/otp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APK Downloads proxy
    location /downloads/ {
        proxy_pass http://127.0.0.1:5050/downloads/;
    }

    # Subpath alias support
    location /app/ {
        alias /var/www/taxi-wisam/build/web/;
        try_files $uri $uri/ /index.html;
    }

    # Root SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Clear-Site-Data '"cache"';
    }
}
